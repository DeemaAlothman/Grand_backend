services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-printing_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-printing_store}']
      interval: 5s
      timeout: 5s
      retries: 10
    # لا يوجد ports هون عمدًا — قاعدة البيانات ما بيلزمها توصل من برا شبكة Docker، فقط الـapi/worker يوصلوها داخليًا.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    # نفس الشي: بدون ports — داخلي فقط.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '9000:9000' # لازم يبقى مكشوف: روابط رفع الصور presigned بتوجه المتصفح لهون مباشرة
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
    # مؤقت لحد ما ينضبط مزود بريد حقيقي (Phase 5) — الإيميلات هلأ ما بتوصل فعليًا لصناديق حقيقية.

  api:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '3019:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: production
    command: ['node', 'dist/worker.js']
    # الصورة موروثة HEALTHCHECK يفحص رابط HTTP (مخصص للـapi) — الـworker ما بيشغّل سيرفر HTTP إطلاقًا،
    # فهاد الفحص رح يفشل دايمًا ويطلع "unhealthy" وهمي رغم إن الـworker شغال تمام. نعطّله هون فقط.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
